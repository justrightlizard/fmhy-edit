# Self-host add-on (not part of upstream fmhy/edit).
#
# Builds the site image and publishes it to GHCR for the NAS to pull.
#   1. Upstream's Dockerfile is built unmodified, with a placeholder hostname,
#      so the real domain never appears in this public repo or the image.
#   2. The placeholder is checked for in the built site. If it's missing,
#      upstream changed how the hostname works and the run fails instead of
#      publishing a broken image.
#   3. selfhost/Dockerfile adds a startup script that writes FMHY_HOSTNAME
#      into the site when the container starts.
#   4. The result is smoke tested, then pushed as latest and sha-<commit>.
#
# Runs on every push to main, which includes the merges pushed by
# sync-upstream.yml (it pushes with SYNC_TOKEN, so it does start this run).

name: Self-host image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fmhy-edit
  PLACEHOLDER: https://fmhy-hostname-placeholder.invalid

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain docker build (no buildx container) so step 3 can build FROM the
      # image step 1 left in the local Docker engine.
      - name: Build the site with upstream's Dockerfile
        run: |
          docker build --pull \
            --build-arg FMHY_HOSTNAME="$PLACEHOLDER" \
            -t fmhy-edit-base:ci .

      - name: Check the placeholder made it into the build
        run: |
          n=$(docker run --rm --entrypoint sh fmhy-edit-base:ci \
                -c "grep -rlF '$PLACEHOLDER' /usr/share/nginx/html | wc -l")
          echo "files containing the placeholder: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::The placeholder hostname isn't in the built site. Upstream may have changed how FMHY_HOSTNAME is used (docs/.vitepress/shared.ts)."
            exit 1
          fi

      - name: Add the runtime hostname script
        run: |
          sha=$(git rev-parse HEAD)
          docker build \
            --build-arg BASE_IMAGE=fmhy-edit-base:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$sha" \
            --label "org.opencontainers.image.title=fmhy-edit (self-host)" \
            -t fmhy-edit:ci selfhost

      - name: Smoke test - hostname is set at startup and the site is served
        run: |
          docker run -d --name fmhy -p 8080:80 -e FMHY_HOSTNAME=https://smoke-test.example fmhy-edit:ci
          for i in $(seq 1 15); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          docker logs fmhy 2>&1 | grep 40-fmhy-hostname
          curl -fs http://127.0.0.1:8080/ | grep -q 'https://smoke-test.example'
          if docker exec fmhy grep -rqF "$PLACEHOLDER" /usr/share/nginx/html; then
            echo "::error::placeholder still present after startup"; exit 1
          fi
          docker rm -f fmhy

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short=$(git rev-parse --short=7 HEAD)
          for tag in "sha-$short" latest; do
            docker tag fmhy-edit:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Pushed $IMAGE:latest and $IMAGE:sha-$short" >> "$GITHUB_STEP_SUMMARY"
