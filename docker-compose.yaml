services:
  docs:
    networks: [fmhy]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FMHY_HOSTNAME: ${FMHY_HOSTNAME}
    image: fmhy-docs
    pull_policy: build
    container_name: fmhy
    restart: unless-stopped
    ports:
      - '127.0.0.1:4173:80'

networks:
  fmhy:
